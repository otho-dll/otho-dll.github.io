# ── Featured project ─────────────────────────────────────────────────────────
# A highlighted tile with its own colors. Swap the values to feature a different project,
# or set `show: false` to hide it.
featured:
  show: true
  # wide    = full-width tile above the Maker log
  # compact = small tile next to the two About tiles
  layout: wide
  label: Featured project
  # One of the names under `statuses` above (e.g. on-hold, working-on, finished); leave empty for none.
  status: on-hold
  title: Tycho Project
  tagline: Carry less. Create more.
  text: "Engineered by Simon."
  image: /images/featured/tycho.png
  image_alt: Tycho Project mission patch
  url: https://tycho.anulab.tech
  button: Visit the project site
  # Colors of this tile only (the rest of the site keeps its own palette).
  colors:
    background: "#161923"
    text: "#f2f2f2"
    accent: "#6cc4f5"
    accent_2: "#ff6a1f"

# ── Maker log (posts and projects on one timeline) ───────────────────────────
maker_log_title: Maker log

# ── Footer ───────────────────────────────────────────────────────────────────
footer:
  owner: Szymon Glinka
  since: 2024
  notes:
    - "This site does NOT use cookies for tracking or collect your personal information."
    - "This site has been made with the help of AI."
