# ─────────────────────────────────────────────────────────────────────────────
#  Site settings — all texts and options shown on the site live here.
#  After saving, `npm start` reloads the page automatically.
#
#  Other content in this folder:
#    posts/       blog posts (one .md file per post, URL: /blog/<file name>/)
#    projects/    projects shown in the Maker log
#    _templates/  copy these to start a new post or project
# ─────────────────────────────────────────────────────────────────────────────

# Used in the browser tab, search results and link previews.
site:
  name: ANUlab
  description: "Simon's projects, tutorials and documentation: electronics, PCB design, 3D printing and programming."
  logo: /images/logo.png
  logo_light: /images/logo-light.png   # same logo with dark text, used in the light theme
  mark: /images/logo-mark.png          # just the cube; faint watermark in the intro tile
  # Preview image for shared links when a page has no image of its own.
  share_image: /images/logo.png

# Second accent color (headings, dates, tags) next to the main blue. One value per theme;
# the light theme needs a darker shade to stay readable.
theme:
  accent_2_dark: "#d9a64a"
  accent_2_light: "#8a5f12"

# ── Project statuses ─────────────────────────────────────────────────────────
# Shown as a badge on the featured project (featured.status below) and on projects
# in the Maker log (`status:` in the project's .md file). Add your own here.
statuses:
  on-hold:
    label: Project on hold
    color: "#9aa3ad"
  working-on:
    label: Working on it
    color: "#5fbf86"
  finished:
    label: Finished
    color: "#5b8def"

# ── Home page: intro tile ────────────────────────────────────────────────────
greeting: "Hi, I'm"
name: Simon
# Typed out one after another under the name.
roles:
  - Hobby developer
  - Student
  - Maker
  - Mechanic
  - Gamer
  - Robotics Technician
intro: "I design and build electronics, robots and 3D-printed things, and write about how they're made."
# What you're up to right now, shown with a pulsing dot at the bottom of the intro tile.
# Leave empty ("") to hide it.
now: "Studying microelectronics and learning PCB design."
# Optional year for a "making since" counter next to the post/project counts (e.g. 2019).
# Leave empty to hide it.
making_since: ""
photo: /images/Me.jpg
photo_alt: Simon with a quadruped robot

# ── About ────────────────────────────────────────────────────────────────────
about:
  - title: A little bit about me
    text: "I started making stuff for real when I got my first 3D printer (the OG Ender3) and since then it has turned into a hobby and my passion. I love designing things and bringing them into the real world! But sometimes I need a break from PC and then I like to hike :)"
  - title: What can I do
    text: "I'm most comfortable with programming (Python, C++) and 3D design (Fusion, FreeCAD). Lately I have also started learning PCB design to elevate my electronic projects. Besides that I am a robotics technician and I'm studying microelectronics."

